plugins {
    id 'com.android.application'
}

android {
    namespace 'com.customaod'
    compileSdk 34

    defaultConfig {
        applicationId "com.customaod"
        minSdk 27          // setShowWhenLocked()/setTurnScreenOn() need API 27
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ViewBinding generates a type-safe binding class per layout file.
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'      // Material Design 3
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'     // MVVM
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'               // Fingerprint unlock
}
