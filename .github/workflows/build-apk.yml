name: Build APK
on:
  push:
  workflow_dispatch:

# Needed so the "commit APK" step below can push back to this repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Don't re-trigger ourselves when the bot commit (with [skip ci]) lands.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships an Android SDK at $ANDROID_HOME with a
      # cmdline-tools directory (its exact version subfolder varies by image,
      # so it's located dynamically instead of hardcoded). We just need to
      # accept licenses and make sure platform 34 / build-tools 34 are present.
      - name: Accept SDK licenses and install platform 34
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -r | head -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK (auto-signed, installable)
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CustomAOD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Artifacts above are convenient in the GitHub UI, but some download
      # clients can't reach the blob-storage host they're served from.
      # Committing the APK straight into the repo makes it fetchable over
      # plain git instead, which has no such restriction.
      - name: Commit APK into the repo
        run: |
          set -e
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/CustomAOD-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/CustomAOD-debug.apk
          git diff --staged --quiet && echo "No change to APK" || git commit -m "ci: update built debug APK [skip ci]"
          git push
